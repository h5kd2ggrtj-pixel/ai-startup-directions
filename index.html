<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="13个AI创业方向的产品规划与优先级分析">
<title>13个 AI 创业方向｜产品规划图</title>
<style>
:root{--bg:#f5f7fb;--ink:#152238;--muted:#68758a;--line:#e3e8f0;--card:#fff;--accent:#4d62e8;--accent2:#eef0ff;--green:#16856a;--orange:#c87716;--shadow:0 16px 40px #15223812}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7f9ff,#f4f7fb 48%,#edf7f4);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button{font:inherit} .shell{max-width:1240px;margin:auto;padding:28px 22px 60px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:end;margin:8px 0 26px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.12em;font-size:12px}.hero h1{font-size:clamp(30px,5vw,56px);line-height:1.05;margin:10px 0}.hero p{color:var(--muted);max-width:680px;margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:12px;cursor:pointer;box-shadow:0 4px 14px #15223808}.actions button.primary{background:var(--accent);color:white;border-color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:16px}.stat b{font-size:26px}.stat span{display:block;color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}.nav{position:sticky;top:16px;background:#ffffffc9;border:1px solid var(--line);border-radius:18px;padding:12px;backdrop-filter:blur(12px)}.nav h3{margin:7px 10px 10px;font-size:13px;color:var(--muted)}.nav button{width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:10px;color:var(--ink);cursor:pointer}.nav button:hover,.nav button.active{background:var(--accent2);color:var(--accent);font-weight:700}.content{min-width:0}.panel{padding:24px;margin-bottom:16px}.panel h2{font-size:28px;margin:0 0 4px}.kicker{color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.box{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fcfdff}.box h3{font-size:14px;margin:0 0 8px;color:var(--accent)}.box ul{margin:0;padding-left:19px}.box li{margin:3px 0}.box.highlight{background:linear-gradient(135deg,#f0f2ff,#fff)}.tag{display:inline-block;padding:3px 8px;border-radius:99px;background:#eaf7f3;color:var(--green);font-size:12px;margin:0 5px 5px 0}.risk{color:#a55b0b;background:#fff6e8}.roadmap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.roadmap .box{position:relative}.roadmap strong{display:block;font-size:17px;margin-bottom:4px}.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:28px}.search{width:100%;border:1px solid var(--line);padding:10px 12px;border-radius:10px;margin-bottom:10px;background:white}@media(max-width:820px){.hero{display:block}.actions{margin-top:16px}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.nav{position:static;display:flex;overflow:auto;gap:5px;padding:8px}.nav h3,.search{display:none}.nav button{white-space:nowrap;width:auto}.grid,.roadmap{grid-template-columns:1fr}.panel{padding:18px}}
</style>
</head>
<body>
<main class="shell">
<section class="hero"><div><div class="eyebrow">AI ENTREPRENEURSHIP MAP · 2026</div><h1>13 个 AI 创业方向</h1><p>从长期陪伴型产品到现实世界基础设施：一份可执行的客户、产品、MVP、商业模式与风险规划图。</p></div><div class="actions"><button class="primary" id="share">分享页面</button><button id="print">打印 / 导出 PDF</button></div></section>
<section class="stats"><div class="stat"><b>13</b><span>战略方向</span></div><div class="stat"><b>5</b><span>适合小团队优先验证</span></div><div class="stat"><b>4</b><span>平台型机会</span></div><div class="stat"><b>4</b><span>重资产或强监管</span></div></section>
<div class="layout"><aside class="nav"><h3>选择方向</h3><input class="search" id="search" placeholder="搜索方向…"><div id="nav"></div></aside><section class="content" id="content"></section></div>
<div class="footer">建议先验证：小软件专属云 · API 自动维护 · AI 原生合规</div>
</main>
<script>
const data=[
['AI 私人老师','轻资产优先验证','小学数学、英语口语、学习困难儿童','学习档案、知识图谱、苏格拉底式讲题、错题变式、家长报告','先做小学数学小程序：拍照识题→分步提示→每日任务→7日效果报告','家庭订阅；学校按学生收费；机构白标','长期学习行为数据与真实教学效果','7日留存、任务完成率、错题复现率下降、续费率','儿童隐私、错误教学、过度依赖'],
['国防科技','重资产/强监管','电站、港口、工业园区、消防应急','雷达/声学/光学融合、边缘识别盒、目标告警、设备健康管理','4—8个传感器节点+边缘网关，识别无人机/车辆/人员并告警','硬件销售；软件订阅；项目集成','复杂环境准确率、认证与政企渠道','识别准确率、误报率、连续运行时长、单点成本','出口管制、军民两用审查、采购周期'],
['小软件专属云','轻资产优先验证','AI编程用户、独立开发者、小工作室、企业自动化团队','代码导入、自动部署、权限、数据库、域名分享、备份回滚、用量计费','支持 Next.js/FastAPI/Streamlit；代码→安全链接；环境变量和一键回滚','免费额度；个人/团队订阅；私有化部署','部署成功率、安全沙箱、应用模板生态','首次部署成功率、上线耗时、应用30日留存、资源毛利','恶意代码、资源滥用、数据泄露、云成本失控'],
['多人协作 AI','平台型机会','市场研究、产品、视频、投研、法务、软件团队','实时协作文档、共享知识库、AI子代理、任务分派、评论审批、引用溯源','多人研究房间：上传资料→共享问答→事实/观点分离→生成报告','团队订阅；企业知识库；私有化；模板市场','共享上下文、权限、引用可信度、工作流集成','团队周活、产出物数、AI结论采纳率、邀请转化率','沦为聊天加协作者、权限泄露、AI幻觉'],
['海上数据中心','重资产/强监管','海上风电、海洋监测、算力运营商','模块化算力舱、海水换热、防腐、远程运维、海底通信','10—100千瓦试验舱，对比陆地 PUE、总成本和维护频率','设备销售；算力租赁；能源联合运营；海洋数据服务','防腐维护、安全认证、海上通信、保险审批','每千瓦总成本、PUE、年故障率、可用率','资本密集、海况灾害、运维费用、审批'],
['十亿级 AI 消费产品','平台型机会','大众用户、内容创作者、家庭用户、游戏用户','AI娱乐、音乐视频、家庭办公、个人记忆、旅行、游戏角色','只做一种内容：录音→音乐短视频；30秒生成、模板、分享、风格记忆','免费增值；会员；模板市场；内容分成；品牌定制','用户资产、社区传播、个人风格、模板生态、推理成本','次日/30日留存、分享率、发布转化率、付费率、单用户毛利','获客成本、大厂复制、版权、同质化'],
['银发 AI 服务','轻资产优先验证','独居老人、子女家庭、养老机构、护理员、保险公司','语音陪伴、用药提醒、跌倒/静止检测、家属报告、护理任务','语音设备或手机：提醒→异常通知→每日状态摘要→家属问候','家庭订阅；养老机构 SaaS；保险合作；硬件销售','低误报、老人易用、家庭数据、护理渠道、安全责任','每日使用率、告警准确率、家属留存、机构续费、响应时间','医疗责任、隐私、误报警、老人不会操作'],
['现实世界操作系统','平台型机会','仓库、工厂、物业、商场、医院、连锁门店','工单、调度、空间地图、设备协议、AI决策、现场视觉、结果验收','从物业维修切入：报修→AI分类→派单→拍照识别→验收→资产档案','按工单/场地/设备收费；实施服务；接口费','行业工作流、现场数据、设备协议、责任闭环','完成时间、首次解决率、人工节省、设备利用率、续费率','交付复杂、硬件兼容、责任归属、定制过多'],
['加密货币基础设施','重资产/强监管','跨境电商、出海 SaaS、外贸、内容公司','企业钱包、稳定币支付、多人审批、地址风控、对账、法币出入金','选择一个国家走廊：收款→到账识别→风险拦截→对账→审批','交易手续费；账户订阅；风控 API；企业实施','牌照、银行通道、AML风控、账务系统','处理金额、成功率、拦截率、对账准确率、企业留存','监管、反洗钱、资金安全、跨境法律'],
['现实世界数据采集','平台型机会','农业、光伏、工业、电力、物流、矿山、保险','任务规划、无人机/传感器采集、清洗、复核、标注、缺陷识别、API','光伏巡检：采图→热斑识别→缺陷工单→历史对比','按面积/设备/次数收费；数据 API；设备租赁','采集网络、行业标签、历史数据、数据质量','数据有效率、识别率、单位成本、采纳率、闭环率','硬件维护、数据所有权、空域许可、采购周期'],
['真人验证系统','平台型机会','媒体、保险、招聘、交易平台、企业','真人注册、设备绑定、内容签名、拍摄时间、编辑链、匿名证明、验证 API','手机拍摄签名→验证二维码→篡改检测→网页验证，不保存原始隐私','按验证次数；企业订阅；SDK授权；行业方案','密码学签名、硬件集成、平台互认、用户信任','验证成功率、欺诈拦截率、误判率、耗时、接入数','隐私泄露、身份盗用、平台不互认'],
['AI 原生合规系统','轻资产优先验证','金融、医疗、教育、招聘、政务、跨境 SaaS','法规监测、AI资产清单、风险分级、PII检测、输出审计、报告与证据链','接入模型 API→记录调用→敏感信息检测→风险告警→月度报告','按员工数/调用量/AI应用数；私有化；咨询增值','法规知识库、行业模板、审计证据链、企业集成','覆盖应用数、告警准确率、拦截率、审计耗时、续费率','法规解释错误、被误当法律意见、跨国规则冲突'],
['API 自动维护工具','轻资产优先验证','SaaS开发团队、独立开发者、平台团队、集成商','文档监控、版本识别、影响分析、自动修复、PR、测试、沙盒、回滚','先做 Stripe GitHub App：检测变化→扫描调用→生成升级 PR→跑测试','个人免费；按仓库/开发者收费；企业私有部署','变化数据库、修复成功率、测试生成、生态覆盖、低误报','发现准确率、PR合并率、修复成功率、误报率、节省时间','自动修改引入 Bug、文档不完整、权限过大、覆盖少']
];
const nav=document.querySelector('#nav'), content=document.querySelector('#content'), search=document.querySelector('#search');
function renderNav(filter=''){nav.innerHTML='';data.forEach((d,i)=>{if(filter&&!d.join(' ').toLowerCase().includes(filter.toLowerCase()))return;let b=document.createElement('button');b.textContent=(i+1)+'. '+d[0];b.onclick=()=>show(i);b.dataset.i=i;nav.appendChild(b)});}
function show(i){let d=data[i];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',+b.dataset.i===i));content.innerHTML=`<article class="panel"><span class="tag">${d[1]}</span><h2>${d[0]}</h2><p class="kicker">适合客户：${d[2]}</p><div class="grid"><div class="box highlight"><h3>产品架构</h3><p>${d[3]}</p></div><div class="box highlight"><h3>MVP 切入</h3><p>${d[4]}</p></div><div class="box"><h3>商业模式</h3><p>${d[5]}</p></div><div class="box"><h3>核心壁垒</h3><p>${d[6]}</p></div><div class="box"><h3>验证指标</h3><p>${d[7]}</p></div><div class="box"><h3>主要风险</h3><p class="risk">${d[8]}</p></div></div></article><article class="panel"><h2>建议验证顺序</h2><div class="roadmap"><div class="box"><strong>0—30天</strong>访谈20名目标用户，完成一个窄场景原型。</div><div class="box"><strong>31—90天</strong>拿到3个真实付费试点，记录使用和交付数据。</div><div class="box"><strong>3—12个月</strong>标准化套餐，扩展相邻行业，形成数据或生态壁垒。</div></div></article>`;}
renderNav();show(2);search.addEventListener('input',e=>renderNav(e.target.value));document.querySelector('#print').onclick=()=>window.print();document.querySelector('#share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);alert('页面地址已复制，可以粘贴分享。')}catch(e){alert('请复制浏览器地址栏中的页面地址分享。')}};
</script>
</body>
</html>
